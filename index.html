<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pantry & Meals</title>
  <meta name="description" content="Pantry, groceries and meal plan. Works offline.">
  <!-- Browser bar color, light and dark -->
  <meta name="theme-color" content="#ece0c2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18110c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation. A bottom bar in portrait, a sidebar in landscape (see styles.css). -->
  <nav class="tabs" id="tabs" aria-label="Screens">
    <a href="#today" data-screen="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Today</span>
    </a>
    <a href="#quests" data-screen="quests">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
      <span>Quests</span>
    </a>
    <a href="#week" data-screen="week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Week</span>
    </a>
    <a href="#pantry" data-screen="pantry">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v3H8z"/><path d="M7 6h10a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M5 13h14"/></svg>
      <span>Pantry</span>
    </a>
    <a href="#groceries" data-screen="groceries">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11l2-8H6.2"/></svg>
      <span>Groceries</span>
    </a>
    <a href="#recipes" data-screen="recipes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>
      <span>Recipes</span>
    </a>
    <a href="#settings" data-screen="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Each screen draws itself in here -->
  <main id="screen" tabindex="-1"></main>

  <!-- Shared pop-up and the little message at the bottom -->
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
