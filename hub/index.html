<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shawnee Hub</title>
<meta name="theme-color" content="#15121d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15121d; color: #ede6d3;
         font: 17px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  img { width: 144px; height: 144px; image-rendering: pixelated; border-radius: 28px; }
  h1 { font: 700 1.6rem Georgia, serif; margin: 16px 0 6px; }
  .btn { display: inline-block; margin: 14px 0; padding: 14px 26px; border: 0; border-radius: 12px; background: #e6c36e;
         color: #15121d; font: 700 1rem system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  input { width: min(340px, 100%); padding: 12px; border-radius: 10px; border: 1px solid #3a3350; background: #1e1a29;
          color: #ede6d3; font-size: 16px; box-sizing: border-box; }
  ol, p.small { text-align: left; max-width: 340px; margin: 8px auto; color: #aaa2bb; font-size: 15px; }
  .small a { color: #aaa2bb; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Shawnee Hub</h1>
  <!-- The Hub's address is never in this public page: it's pasted once and kept on this phone only. -->
  <section id="setup" hidden>
    <p class="small">Paste your Hub's link once. It stays on this phone only.</p>
    <input id="link" type="url" placeholder="https://claude.ai/artifact/…" autocomplete="off">
    <br><button class="btn" id="save">Save and open</button>
  </section>
  <section id="ready" hidden>
    <a class="btn" id="go" href="#">Enter the Hall</a>
    <ol id="how">
      <li>In Chrome, tap the ⋮ menu.</li>
      <li>Tap <b>Add to home screen</b>, then <b>Install</b>.</li>
      <li>Open the Hub from the new campfire icon.</li>
    </ol>
    <p class="small"><a href="#" id="forget">Change the saved link</a></p>
  </section>
</main>
<script>
  const KEY = 'shawnee-hub-link';
  const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const ok = (u) => /^https:\/\/claude\.ai\/(code\/)?artifact\//.test(u || '');
  const show = () => {
    const link = get();
    document.getElementById('setup').hidden = ok(link);
    document.getElementById('ready').hidden = !ok(link);
    if (ok(link)) document.getElementById('go').href = link;
    return link;
  };
  document.getElementById('save').onclick = () => {
    const u = document.getElementById('link').value.trim();
    if (!ok(u)) { alert('That should be your Hub link, starting with https://claude.ai/artifact/'); return; }
    try { localStorage.setItem(KEY, u); } catch (e) {}
    show();
  };
  document.getElementById('forget').onclick = (e) => {
    e.preventDefault(); try { localStorage.removeItem(KEY); } catch (err) {} show();
  };
  // Launched from the home-screen icon with a saved link: go straight to the Hub.
  const link = show();
  const installed = matchMedia('(display-mode: standalone)').matches || new URLSearchParams(location.search).has('app');
  if (installed && ok(link)) location.replace(link);
</script>
</body>
</html>
